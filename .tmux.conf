set -g default-terminal "ghostty"
set -g base-index 1
setw -g pane-base-index 1
set -g detach-on-destroy off

##############
### Design ###
##############
set -g default-terminal "tmux-256color"
set -g status-position bottom
set -g status-justify centre
set -g status-style 'bg=default fg=cyan'
set -g status-left ' #[fg=green,bold]#S#[default]'
set -g status-right '#[fg=green] %b %d %l:%M %p '
set -g status-right-length 30
set -g status-left-length 30
setw -g window-status-current-style 'fg=black bg=green bold'
setw -g window-status-current-format ' #I#[fg=black]:#[fg=black]#W#[fg=black]#F '
setw -g window-status-style 'fg=cyan bg=black'
setw -g window-status-format ' #I#[fg=cyan]:#[fg=cyan]#W#[fg=cyan]#F '
setw -g window-status-bell-style 'fg=colour255 bg=colour1 bold'

####################
### I don't know ###
####################
set -s escape-time 0
set -g focus-events on
set -g mouse off

#######################
### Copy-mode stuff ###
#######################
setw -g mode-keys vi
bind v copy-mode
bind p paste-buffer
unbind -T copy-mode-vi v
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

###################
### Keybindings ###
###################
bind C-s display-popup -E "bash ~/.tmux/select-session.sh"
bind C-x if-shell "[ #{window_panes} -gt 1 ]" \
    "kill-pane" "confirm-before -p 'kill pane #P? (y/n)' kill-pane"
bind x if-shell "[ #{session_windows} -gt 1 ]" \
    "kill-window" "confirm-before -p 'kill window #W? (y/n)' kill-window"
bind X confirm-before -p "kill-session #S? (y/n)" kill-session
bind r command-prompt -I "#S" "rename-session '%%'"
bind C-r source-file ~/.tmux.conf \; display-message "Config reloaded."
bind C-h previous-window
bind C-l next-window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# bind g list-windows -F '#I "#W"' | awk '$2 ~ /"NAME"/ { print $1 }'

# image.nvim
set -gq allow-passthrough on
set -g visual-activity off

###############
### Plugins ###
###############
set -g @plugin 'Morantron/tmux-fingers'

run '~/.tmux/plugins/tpm/tpm'
